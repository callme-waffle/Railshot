# Apply once to each reviewed customer cluster with its existing administrator.
# This adds only self-renewal; existing deployment roles and bindings stay intact.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: railshot-argocd-renewal
  namespace: tenant-demo
  labels: {app.kubernetes.io/managed-by: railshot}
rules:
  - apiGroups: ['']
    resources: [serviceaccounts/token]
    resourceNames: [railshot-argocd]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: railshot-argocd-renewal
  namespace: tenant-demo
  labels: {app.kubernetes.io/managed-by: railshot}
subjects:
  - {kind: ServiceAccount, name: railshot-argocd, namespace: tenant-demo}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: railshot-argocd-renewal}
