# Install only in Jasmin-Softbank/railshot-apps. The protected environment owns
# GHCR_PULL_TOKEN (classic PAT, read:packages) and the operator role/username vars.
# This delivery job is independent of image publishing and never reads SSM secrets.
name: railshot-pull-credential
on: workflow_dispatch
permissions: {}
concurrency:
  group: railshot-ghcr-pull-credential
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-24.04
    environment: railshot-release
    timeout-minutes: 5
    permissions: {id-token: write}
    steps:
      - name: Validate operator credential destination
        env:
          SYNC_ROLE_ARN: ${{ vars.GHCR_PULL_SYNC_ROLE_ARN }}
          PULL_USERNAME: ${{ vars.GHCR_PULL_USERNAME }}
        run: |
          python3 -I - <<'PY'
          import os, re
          assert os.environ['GITHUB_REPOSITORY'].casefold() == 'jasmin-softbank/railshot-apps', 'trusted repository required'
          assert re.fullmatch(r'arn:aws:iam::721622471953:role/[A-Za-z0-9+=,.@_/-]+', os.environ['SYNC_ROLE_ARN']), 'operator AWS role required'
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9-]{0,38}', os.environ['PULL_USERNAME']), 'operator pull username required'
          PY
      - name: Assume the dedicated delivery role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.GHCR_PULL_SYNC_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: '721622471953'
          role-session-name: railshot-ghcr-pull-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          output-credentials: false
          unset-current-credentials: true
          action-timeout-s: 60
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"ssm:PutParameter",
            "Resource":"arn:aws:ssm:ap-northeast-2:721622471953:parameter/railshot/registry/ghcr/pull_token"}]}
      - name: Deliver the private pull token as a SecureString
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          python3 -I - <<'PY'
          import json, os, subprocess, tempfile
          token = os.environ.get('GHCR_PULL_TOKEN', '')
          if not token or token != token.strip() or any(c.isspace() for c in token):
              raise SystemExit('Dedicated GHCR pull token is unavailable or invalid')
          request = {'Name': '/railshot/registry/ghcr/pull_token', 'Type': 'SecureString',
                     'Value': token, 'Overwrite': True, 'Tier': 'Standard',
                     'Description': 'Railshot GHCR classic PAT; read:packages only; expires 2026-10-09'}
          descriptor, filename = tempfile.mkstemp(prefix='railshot-pull-', suffix='.json', dir=os.environ['RUNNER_TEMP'])
          try:
              with os.fdopen(descriptor, 'w') as stream:
                  os.fchmod(stream.fileno(), 0o600)
                  json.dump(request, stream)
              child_env = {k: v for k, v in os.environ.items() if k != 'GHCR_PULL_TOKEN'}
              result = subprocess.run(['aws', 'ssm', 'put-parameter', '--region', 'ap-northeast-2',
                                       '--cli-input-json', 'file://' + filename, '--no-cli-pager'],
                                      env=child_env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                                      timeout=60, check=False)
              if result.returncode:
                  raise SystemExit('SecureString delivery failed; token was not printed')
          finally:
              os.unlink(filename)
          print('SecureString delivery accepted; runtime pull remains separately verified')
          PY
