[project]
name = "railshot-fixture-fastapi"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0"]

[dependency-groups]
dev = ["httpx==0.28.1", "ruff==0.16.8", "mypy==2.3.1", "pytest==9.1.1"]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
